
server.port=9191
eureka.client.service-url.defaultZone=https://protective-determination-production.up.railway.app/eureka/


spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=Content-Type,Authorization,X-Requested-By


# Gateway routes
# Gateway route for LOGIN-SERVICE without load balancing
spring.cloud.gateway.routes[0].id=LOGIN-SERVICE
spring.cloud.gateway.routes[0].uri=https://spirited-liberation-production-0153.up.railway.app
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/login/**
spring.cloud.gateway.routes[0].filters[0]=RemoveRequestHeader=Authorization

# Protect all other services with JWT authentication
spring.cloud.gateway.routes[1].id=MEMBERS-SERVICE
spring.cloud.gateway.routes[1].uri=https://strong-alignment-production.up.railway.app
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/members/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[1].filters[1]=AddRequestHeader=X-Requested-By, 3H#7D*faG&L^2z!9Xy@uKp6T





spring.cloud.gateway.routes[2].id=DOCUMENTS-SERVICE
spring.cloud.gateway.routes[2].uri=http://document-service-production-8e33.up.railway.app
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/files/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter
spring.cloud.gateway.routes[2].filters[1]=AddRequestHeader=X-Requested-By, MyApiDocuments
spring.cloud.gateway.routes[2].filters[2]=RewritePath=/api/files/(?<remaining>.*), /${remaining}


spring.cloud.gateway.routes[3].id=EVENT-SERVICE
spring.cloud.gateway.routes[3].uri=https://event-service-production-5c9f.up.railway.app
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/events/**
spring.cloud.gateway.routes[3].filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.routes[3].filters[1]=AddRequestHeader=X-Requested-By, MyApiEvents
spring.cloud.gateway.routes[3].filters[2]=RewritePath=/api/events/(?<remaining>.*), /${remaining}


